<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="生前整理と遺品整理の違い">
  <rect width="1000" height="320" fill="#F4F8FB"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#0B2A4A">生前整理と遺品整理の違い</text>
  <g font-family="sans-serif">
    <!-- left: seizen -->
    <rect x="20" y="60" width="468" height="230" rx="8" fill="#FFFFFF" stroke="#0B2A4A" stroke-width="2"/>
    <rect x="20" y="60" width="468" height="48" rx="8" fill="#0B2A4A"/>
    <text x="254" y="91" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">生前整理</text>
    <text x="44" y="140" font-size="13" font-weight="bold" fill="#0F4C81">時期</text>
    <text x="120" y="140" font-size="13" fill="#232A33">本人が元気なうち</text>
    <text x="44" y="172" font-size="13" font-weight="bold" fill="#0F4C81">主体</text>
    <text x="120" y="172" font-size="13" fill="#232A33">本人（家族は手伝い）</text>
    <text x="44" y="204" font-size="13" font-weight="bold" fill="#0F4C81">目的</text>
    <text x="120" y="204" font-size="13" fill="#232A33">暮らしを軽くし、引き継ぐ情報を残す</text>
    <text x="44" y="236" font-size="13" font-weight="bold" fill="#0F4C81">中身</text>
    <text x="120" y="236" font-size="13" fill="#232A33">持ち物の仕分け、書類と資産の棚卸し</text>
    <text x="44" y="268" font-size="13" font-weight="bold" fill="#0F4C81">進め方</text>
    <text x="120" y="268" font-size="13" fill="#232A33">本人のペースで少しずつ</text>
    <!-- right: ihin -->
    <rect x="512" y="60" width="468" height="230" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <rect x="512" y="60" width="468" height="48" rx="8" fill="#0F4C81"/>
    <text x="746" y="91" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">遺品整理</text>
    <text x="536" y="140" font-size="13" font-weight="bold" fill="#0F4C81">時期</text>
    <text x="612" y="140" font-size="13" fill="#232A33">逝去のあと</text>
    <text x="536" y="172" font-size="13" font-weight="bold" fill="#0F4C81">主体</text>
    <text x="612" y="172" font-size="13" fill="#232A33">遺族（相続人）</text>
    <text x="536" y="204" font-size="13" font-weight="bold" fill="#0F4C81">目的</text>
    <text x="612" y="204" font-size="13" fill="#232A33">形見分けと家の片付け、相続の前提整理</text>
    <text x="536" y="236" font-size="13" font-weight="bold" fill="#0F4C81">中身</text>
    <text x="612" y="236" font-size="13" fill="#232A33">貴重品の探索、形見分け、処分の手配</text>
    <text x="536" y="268" font-size="13" font-weight="bold" fill="#0F4C81">進め方</text>
    <text x="612" y="268" font-size="13" fill="#232A33">期限のある手続きと並行しやすい</text>
  </g>
  <text x="500" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#55677C">生前整理をしておくと、遺品整理の負担と「どこに何があるか分からない」混乱が減ります。</text>
</svg>
