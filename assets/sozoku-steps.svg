<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="実家を相続したら最初にやること 4つの確認">
  <rect width="1000" height="250" fill="#F4F8FB"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#0B2A4A">相続したら最初にやること 4つの確認</text>
  <!-- step boxes -->
  <g font-family="sans-serif">
    <!-- 1 -->
    <rect x="20" y="70" width="216" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="128" cy="98" r="16" fill="#0B2A4A"/>
    <text x="128" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="128" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">名義を確認する</text>
    <text x="128" y="164" text-anchor="middle" font-size="12" fill="#55677C">登記事項証明書で</text>
    <text x="128" y="182" text-anchor="middle" font-size="12" fill="#55677C">現在の所有者を確かめる</text>
    <!-- 2 -->
    <rect x="268" y="70" width="216" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="376" cy="98" r="16" fill="#0B2A4A"/>
    <text x="376" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="376" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">相続登記を進める</text>
    <text x="376" y="164" text-anchor="middle" font-size="12" fill="#55677C">相続を知った日から</text>
    <text x="376" y="182" text-anchor="middle" font-size="12" fill="#55677C">3年以内が原則</text>
    <!-- 3 -->
    <rect x="516" y="70" width="216" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="624" cy="98" r="16" fill="#0B2A4A"/>
    <text x="624" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="624" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">納税通知を確認する</text>
    <text x="624" y="164" text-anchor="middle" font-size="12" fill="#55677C">固定資産税の金額と</text>
    <text x="624" y="182" text-anchor="middle" font-size="12" fill="#55677C">払う担当を決める</text>
    <!-- 4 -->
    <rect x="764" y="70" width="216" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="872" cy="98" r="16" fill="#0B2A4A"/>
    <text x="872" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="872" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">空き家を管理する</text>
    <text x="872" y="164" text-anchor="middle" font-size="12" fill="#55677C">通水・換気・郵便物</text>
    <text x="872" y="182" text-anchor="middle" font-size="12" fill="#55677C">近隣への配慮も</text>
    <!-- arrows -->
    <g fill="#0F4C81">
      <path d="M240 128 L256 128 L256 120 L262 135 L256 150 L256 142 L240 142 Z"/>
      <path d="M488 128 L504 128 L504 120 L510 135 L504 150 L504 142 L488 142 Z"/>
      <path d="M736 128 L752 128 L752 120 L758 135 L752 150 L752 142 L736 142 Z"/>
    </g>
  </g>
  <text x="500" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#55677C">期限や必要書類は状況によって変わります。迷ったら法務局・自治体の窓口や専門家（司法書士・税理士）に確認してください。</text>
</svg>
