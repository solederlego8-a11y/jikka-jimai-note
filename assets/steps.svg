<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="実家じまいの5ステップ">
  <rect width="1000" height="250" fill="#F4F8FB"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#0B2A4A">実家じまいの進め方 5ステップ</text>
  <!-- step boxes -->
  <g font-family="sans-serif">
    <!-- 1 -->
    <rect x="20" y="70" width="168" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="104" cy="98" r="16" fill="#0B2A4A"/>
    <text x="104" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="104" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">家族で話し合う</text>
    <text x="104" y="164" text-anchor="middle" font-size="12" fill="#55677C">方針と期限を</text>
    <text x="104" y="182" text-anchor="middle" font-size="12" fill="#55677C">家族で共有する</text>
    <!-- 2 -->
    <rect x="216" y="70" width="168" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="300" cy="98" r="16" fill="#0B2A4A"/>
    <text x="300" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="300" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">貴重品・書類を探す</text>
    <text x="300" y="164" text-anchor="middle" font-size="12" fill="#55677C">通帳・権利証</text>
    <text x="300" y="182" text-anchor="middle" font-size="12" fill="#55677C">保険証券・印鑑</text>
    <!-- 3 -->
    <rect x="412" y="70" width="168" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="496" cy="98" r="16" fill="#0B2A4A"/>
    <text x="496" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="496" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">部屋ごとに仕分ける</text>
    <text x="496" y="164" text-anchor="middle" font-size="12" fill="#55677C">4つの区分で</text>
    <text x="496" y="182" text-anchor="middle" font-size="12" fill="#55677C">迷うものは保留箱へ</text>
    <!-- 4 -->
    <rect x="608" y="70" width="168" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="692" cy="98" r="16" fill="#0B2A4A"/>
    <text x="692" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="692" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">処分・譲渡を進める</text>
    <text x="692" y="164" text-anchor="middle" font-size="12" fill="#55677C">自治体の回収</text>
    <text x="692" y="182" text-anchor="middle" font-size="12" fill="#55677C">買取・寄付も選択肢</text>
    <!-- 5 -->
    <rect x="804" y="70" width="168" height="130" rx="8" fill="#FFFFFF" stroke="#0F4C81" stroke-width="2"/>
    <circle cx="888" cy="98" r="16" fill="#0B2A4A"/>
    <text x="888" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">5</text>
    <text x="888" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#232A33">家の扱いを決める</text>
    <text x="888" y="164" text-anchor="middle" font-size="12" fill="#55677C">売却・賃貸・解体</text>
    <text x="888" y="182" text-anchor="middle" font-size="12" fill="#55677C">当面は管理も含む</text>
    <!-- arrows -->
    <g fill="#0F4C81">
      <path d="M192 128 L208 128 L208 120 L214 135 L208 150 L208 142 L192 142 Z"/>
      <path d="M388 128 L404 128 L404 120 L410 135 L404 150 L404 142 L388 142 Z"/>
      <path d="M584 128 L600 128 L600 120 L606 135 L600 150 L600 142 L584 142 Z"/>
      <path d="M780 128 L796 128 L796 120 L802 135 L796 150 L796 142 L780 142 Z"/>
    </g>
  </g>
  <text x="500" y="228" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#55677C">順番どおりでなくても大丈夫です。期限がある手続き（相続・解約など）がある場合は、そちらを先に確認してください。</text>
</svg>
